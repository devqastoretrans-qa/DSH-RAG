name: CI/CD Pipeline - Doctor Sarah Hensley AI RAG

on:
  push:
    branches:
      - main
      - master
      - staging
      - develop
  pull_request:
    branches:
      - main
      - master
      - staging

jobs:
  # =========================================================================
  # STAGE 1: Continuous Integration (Automated Quality Gate)
  # =========================================================================
  test:
    name: Lint, Validate & Run Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      ENVIRONMENT: test
      RAG_API_KEY: dsh_rag_secret_key_2026
      PYTHONIOENCODING: utf-8
      ENABLE_DRIVE_MONITOR: "false"
      QDRANT_TIMEOUT: "10.0"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install PyTorch (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install Pinned Dependencies
        run: |
          pip install -r requirements.txt

      - name: Verify Dependency Graph (pip check)
        run: |
          pip check

      - name: Syntax & Bytecode Compilation Check
        run: |
          python -m py_compile app.py
          python -m compileall src/

      - name: Run Automated Regression Test Suite
        run: |
          python test_new_enhancements.py

  # =========================================================================
  # STAGE 2: Continuous Deployment (Zero-Downtime AWS EC2 Rollout)
  # =========================================================================
  deploy:
    name: Deploy to AWS EC2 Production
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST || '18.118.138.91' }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            bash -c 'set -e; for dir in /home/ubuntu/RAG-DSH /home/ubuntu/dsh-rag "$HOME/RAG-DSH"; do [ -d "$dir" ] && [ -f "$dir/app.py" ] && cd "$dir" && break; done; if [ ! -f "app.py" ]; then cd $(find /home/ubuntu -maxdepth 2 -name "app.py" -exec dirname {} \; 2>/dev/null | head -n 1); fi; echo "Deploying in: $(pwd)"; git fetch origin main; git reset --hard origin/main; chmod +x scripts/deploy_ec2.sh 2>/dev/null || true; if [ -f "scripts/deploy_ec2.sh" ]; then ./scripts/deploy_ec2.sh; else [ -d "venv" ] && source venv/bin/activate && pip install --no-cache-dir -r requirements.txt; sudo systemctl restart dsh-rag 2>/dev/null || true; fi'

